<Directory "/usr1/www/html">

	# regex that macthes common file extensions 
        Define CE_EXTENSION_LIST pdf|ppt[x]?|doc[x]?|htm[l]?|t[e]?xt|easm|jp[e]?g|xls[x]?|gif|tif[f]?|png|bmp|zip|tar|odp|dwg|tex|ps|avi|w[am]v|mp[e]?[gpx34]|mov|dat|slddrw|sldprt|fpd
        
	# regex matching a dcc document designation
	Define CE_DOCUMENT_PATTERN ^(CE\-)?([A-Z]\d{6,7}|\d+)(-[vx])?(\d+)?
	
        # regex that matches the end of a url : .../ .../main .../main/
        Define CE_URL_TAIL (/main)?

        # Extensive logs during the setup phase, remove at MTP
	LogLevel alert rewrite:trace4
       
        RewriteEngine On
        RewriteBase /
        Options +FollowSymLinks

        ## Do not rewrite if already pointing to a valid file or directory , skip next 7 rules if it does 
	RewriteCond %{REQUEST_FILENAME} -f  [OR]
	RewriteCond %{REQUEST_FILENAME} -d
   RewriteRule (.*) - [S=7]


	## Document Card
	## Input  : /CE-M080351-v3 or /M080351-x0/main or /M080351/ 
   ## Output : /cgi-bin/private/DocDB/ShowDocument?docid=M080351&version=3
	RewriteRule ${CE_DOCUMENT_PATTERN}${CE_URL_TAIL}/?$ /cgi-bin/private/DocDB/ShowDocument\?docid\=$2\&version=$4 [QSA,NC]

	## Get Main File
	## Input  : /CE-M080351-v15/main
	## Output : /cgi-bin/private/DocDB/RetrieveFile\?docid\=M080351o
	RewriteRule ${CE_DOCUMENT_PATTERN}${CE_URL_TAIL}/?  /cgi-bin/private/DocDB/RetrieveFile\?docid\=$2 [QSA,NC]


	## retrieve file with alternate extension
	## Input  : /CE-M080351-v3.pdf
	## Output : /cgi-bin/private/DocDB/RetrieveFile\?docid\=M080351&version=3&extension=pdf
 	RewriteRule ${CE_DOCUMENT_PATTERN}\.(${CE_EXTENSION_LIST}) /cgi-bin/private/DocDB/RetrieveFile\?docid\=$2\&version\=$4\&extension\=$5 [QSA,NC]

	## Generate XML 
	## Input  : /CE-M080351-v3/of=xml 
        ## Output : /cgi-bin/private/DocDB/ShowDocument?docid=M080351&version=3&outformat=xml
	RewriteRule ${CE_DOCUMENT_PATTERN}/?of=(xml|html)?$ /cgi-bin/private/DocDB/ShowDocument\?docid\=$2\&version\=$4\&outformat\=$6 [QSA,NC]


   ## not sure what these rules are for.
   ## public:
    # filenames with pound sign:
    RewriteRule ![\ #]+$ - [S=1]
    RewriteRule ^(CE-)?(\w{1}\d{6,7}|\d{1,})(-[vx])?(\d{1,})?(.*)$ /cgi-bin/private/DocDB/Search\?maxdocs\=10\&outerlogic\=AND\&innerlogic\=AND\&numbersearch\=$2\&numbersearchmode\=allsub [QSA,NC,NE]
    # generic filename rule:
    RewriteRule ^/(CE-)?(\w{1}\d{6,7}|\d{1,})(-[vx])?(\d{1,})?/(.*)$ /cgi-bin/private/DocDB/RetrieveFile\?docid\=$2\&version\=$4\&filename\=$5 [QSA,NC,NE]

</Directory>
