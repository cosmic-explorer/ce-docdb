# Anchored to the public-document short-URL form; "^/(.+)/public" matched any
# URL containing /public and granted it anonymously (finding N2).
<LocationMatch "(?i)^/(CE-)?([A-Z]\d{6,7}|\d+)(-[vx])?(\d+)?(/main)?/public(/|$)">

	Require all granted
 	
	# regex that macthes common file extensions 
        Define CE_EXTENSION_LIST pdf|ppt[x]?|doc[x]?|htm[l]?|t[e]?xt|easm|jp[e]?g|xls[x]?|gif|tif[f]?|png|bmp|zip|tar|odp|dwg|tex|ps|avi|w[am]v|mp[e]?[gpx34]|mov|dat|slddrw|sldprt|fpd
        
        # regex that matches the end of a public url : .../public .../main/public .../public/main .../main/public/main with or without trailing /
        Define CE_PUBLIC_TAIL (/main)?/public(/main)?

	# regex matching a dcc document designation
	Define CE_DOCUMENT_PATTERN (CE\-)?([A-Z]\d{6,7}|\d+)(-[vx])?(\d+)?
	

        # Extensive logs during the setup phase, remove at MTP
	LogLevel alert rewrite:trace4
	RewriteEngine on 
	## Do not rewrite if already pointing to a valid file or directory
	RewriteCond %{REQUEST_FILENAME} !-f 
	RewriteCond %{REQUEST_FILENAME} !-d


	## Get Main File
	## Input  : /CE-M080351-v15/main/public
	## Output : /cgi-bin/DocDB/RetrieveFile\?docid\=M080351
	RewriteRule ${CE_DOCUMENT_PATTERN}${CE_PUBLIC_TAIL}/?  /cgi-bin/DocDB/RetrieveFile\?docid\=$2 [QSA,NC]

	## retrieve file with alternate extension
	## Input  : /CE-M080351-v3.pdf/public
	## Output : /cgi-bin/DocDB/RetrieveFile\?docid\=M080351&version=3&extension=pdf
 	RewriteRule ${CE_DOCUMENT_PATTERN}\.(${CE_EXTENSION_LIST}) /cgi-bin/DocDB/RetrieveFile\?docid\=$2\&version\=$4\&extension\=$5 [QSA,NC]


	## Document Card
	## Input  : /CE-M080351-v3/public/ or /M080351-x0/main/public or /M080351/public/main 
        ## Output : /cgi-bin/DocDB/ShowDocument?docid=M080351&version=3
	RewriteRule ${CE_DOCUMENT_PATTERN}${CE_PUBLIC_TAIL}/?$ /cgi-bin/DocDB/ShowDocument\?docid\=$2\&version=$4 [QSA,NC]

	## Generate XML 
	## Input  : /CE-M080351-v3/public/of=xml 
        ## Output : /cgi-bin/DocDB/ShowDocument?docid=M080351&version=3&outformat=xml
# fails with error message:
#There were errors processing your request:
#    File names with / are not allowed for security reasons. 

	RewriteRule ${CE_DOCUMENT_PATTERN}/public/of=(xml|html)?$ /cgi-bin/DocDB/ShowDocument\?docid\=$2\&version\=$4\&outformat\=$6 [QSA,NC]


   ## not sure what these rules are for.
   ## public:
    # filenames with pound sign:
    RewriteRule ![\ #]+$ - [S=1]
#    RewriteRule ^(CE-)?(\w{1}\d{6,7}|\d{1,})(-[vx])?(\d{1,})?(.*)$ /cgi-bin/DocDB/Search\?maxdocs\=10\&outerlogic\=AND\&innerlogic\=AND\&numbersearch\=$2\&numbersearchmode\=allsub [QSA,NC,NE]
    # generic filename rule:
#    RewriteRule ^(CE-)?(\w{1}\d{6,7}|\d{1,})(-[vx])?(\d{1,})?/(.*)$ /cgi-bin/DocDB/RetrieveFile\?docid\=$2\&version\=$4\&filename\=$5 [QSA,NC,NE]

</LocationMatch>
