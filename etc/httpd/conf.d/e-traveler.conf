Alias /e-traveler /var/www/E-Traveler/html
ScriptAlias /et-cgi /var/www/E-Traveler/cgi-bin


<Location "/e-traveler">
      Options +ExecCGI +Indexes
      AddHandler cgi-script .cgi .tcl .pl
      DirectoryIndex index.html	      
      ErrorDocument 403 default
      ErrorDocument 404 default
      AuthType shibboleth
      AuthName "This content is viewable by only LIGO/Virgo personnel. Please enter your LIGO Directory name, e.g. albert.einstein, and password to continue."
      AuthType shibboleth
      ShibRequestSetting requireSession 1
      <RequireAll>
            require shib-session
            require shib-attr isMemberOf Communities:LSCVirgoLIGOGroupMembers
      </RequireAll>
      Options +IncludesNoExec +FollowSymLinks
   XBitHack on
</Location>


<Location "/e-traveler/html/data">
    Options +Indexes +FollowSymLinks +IncludesNoExec
</Location>

