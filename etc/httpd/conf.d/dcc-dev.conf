<VirtualHost _default_:443>
    ##
    ## /cgi-bin script alias is COMMENTED OUT in httpd.conf to avoid collisions
    ## and overlaps with dcc's urls
    ## therefore othe cgi apps (bugzilla , awstats etc) need to define their own 
    ## set of aliases 
    ##


    DocumentRoot /usr1/www/html

    SSLEngine On
    SSLCertificateFile /etc/httpd/x509-certs/${DCC_INSTANCE}.pem
    SSLCertificateKeyFile /etc/httpd/x509-certs/${DCC_INSTANCE}.key
    SSLCertificateChainFile /etc/httpd/x509-certs/${DCC_INSTANCE}.cert
    
    <Location />
       AllowOverride None
       DirectoryIndex index.html index.cgi /dcc
       AuthType shibboleth
       AuthName "This content is viewable by only LIGO/Virgo personnel. Please enter your LIGO Directory name, e.g. albert.einstein, and password to continue."
       ShibRequestSetting RequireSession true
       <RequireAny>
            require shib-session
#            require all granted
       </RequireAny>
       XbitHack on


# DELETEME:
# force no cache as much as possible
#
  FileETag None
  <ifModule mod_headers.c>
     Header unset ETag
     Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
     Header set Pragma "no-cache"
     Header set Expires "Wed, 11 Jan 1984 05:00:00 GMT"
  </ifModule>
    </Location>
     
   #
   #  where the private version of the dcc code lives
   #  using the alias and Location shoudl make the move away
   #  from /usr1 easier.
   #
   Alias /cgi-bin/private/DocDB /usr1/www/cgi-bin/private/DocDB

   ScriptAlias /dcc /usr1/www/cgi-bin/private/DocDB/DocumentDatabase

   <Location "/cgi-bin/private/DocDB">
       Options +ExecCGI
       DirectoryIndex DocumentDatabase
       SetHandler cgi-script
       # No PATH_INFO: a trailing path segment must not turn a private
       # script URL into one matched by the anonymous static-file rules.
       AcceptPathInfo Off
       AuthType shibboleth
       ShibRequestSetting requireSession true
       Require shib-session
   </Location>




   #
   # where the files attached to the documents live
   # ultimately I want it to be /dcc/data but for now I'll
   # accept /usr1/www/html b/c symlinking of public docs
   #

   DefineExternalGroup dccauth environment /usr1/www/cgi-bin/private/DocDB/RemoteUserHasAccess
   Alias "/DocDB" "/usr1/www/html/DocDB"
   <Location "/DocDB">
        Options +Indexes
       AuthType shibboleth
       AuthName "This content is viewable by only LIGO/Virgo personnel. Please enter your LIGO Directory name, e.g. albert.einstein, and password to continue."
       ShibRequestSetting requireSession true
       <RequireAll>
           GroupExternal dccauth
           Require external-group foobar
           Require all granted
       </RequireAll>
   </Location>


    #
    #  landing page uses images stored at url root. These need explicit relaxed permissions
    #
    <LocationMatch "^/.*\.(gif|jpe?g|png|icoi|js|css)$">
        Require all granted
    </LocationMatch>

    #####################################################################
    ##
    ##
    ##
    ##  Public DCC ( /cgi-bin/DocDB urls)
    ##
    ##
    ##
    #####################################################################
 
   Alias "/pub" "/usr1/www/cgi-bin/DocDB"
   Alias /cgi-bin/DocDB /usr1/www/cgi-bin/DocDB

   <Location "/cgi-bin/DocDB">
           Require all granted
           Options +ExecCGI +FollowSymlinks
           DirectoryIndex DocumentDatabase
           SetHandler cgi-script
           AcceptPathInfo Off
   </Location>

   #Alias /public/Static /var/www/html/public/Static
   Alias /public /usr1/www/html/public
   <Location "/public">
       Options +Indexes +FollowSymLinks +IncludesNoExec +ExecCGI
       require all granted
       DirectoryIndex "/cgi-bin/DocDB/DocumentDataBase"
   </Location>




    # Anonymous access only for public-document short URLs. The pattern must be
    # anchored to the document-number form: the old "^/(.+)/public" matched any
    # URL containing /public and skipped the login for it (finding N2).
    <LocationMatch "(?i)^/(CE-)?([A-Z]\d{6,7}|\d+)(-[vx])?(\d+)?(/main)?/public(/|$)">
        AuthType None
        Require all granted
    </LocationMatch>

    ProxyPreserveHost On

    ProxyPass /rest-dcc/ http://rest-api:8443/
    ProxyPassReverse /rest-dcc/ http://rest-api:8443/
   <LocationMatch "^/rest-dcc">
       require all granted
   </LocationMatch>

    ProxyPass /oauth/ http://oauth-server:4444/
    ProxyPassReverse /oauth/ http://oauth-server:4444/
   <LocationMatch "^/oauth">
       require all granted
       RequestHeader set X-Forwarded-Proto "https"
   </LocationMatch>

   ProxyPass /consent http://oauth-consent:3000/consent
   ProxyPassReverse /consent http://oauth-consent:3000/consent
   <LocationMatch "^/consent">
       require all granted
       RequestHeader set X-Forwarded-Proto "https"
   </LocationMatch>

   ProxyPass /login http://oauth-consent:3000/login
   ProxyPassReverse /login http://oauth-consent:3000/login
   <LocationMatch "^/login">
       RequestHeader set X-Forwarded-Proto "https"
       RequestHeader set X-Shib-Remote-User %{REMOTE_USER}s
       RequestHeader set X-Shib-Secret ${SHIB_HEADER_SECRET}
       <RequireAll>
           require shib-session
           <RequireAny>
               require shib-attr eduPersonPrincipalName ${REST_AUTHORIZED_EPPN}
               require shib-attr eduPersonPrincipalName lppekows@syr.edu
               require shib-attr eduPersonPrincipalName ahnitz@syr.edu
               require shib-attr eduPersonPrincipalName kjgarvey@syr.edu
           </RequireAny>
       </RequireAll>
   </LocationMatch>

# Basic Apache configuration

<IfModule mod_alias.c>
  <Location /shibboleth-ds>
    <IfVersion >= 2.4>
      Require all granted
    </IfVersion>
    <IfVersion < 2.4>
      Allow from all
    </IfVersion>
    <IfModule mod_shib.c>
      AuthType shibboleth
      ShibRequestSetting requireSession false
      require shibboleth
    </IfModule>
  </Location>
  Alias /shibboleth-ds/idpselect_config.js /etc/shibboleth-ds/idpselect_config.js
  Alias /shibboleth-ds/idpselect.js /etc/shibboleth-ds/idpselect.js
  Alias /shibboleth-ds/idpselect.css /etc/shibboleth-ds/idpselect.css
  Alias /shibboleth-ds/index.html /etc/shibboleth-ds/index.html
  Alias /shibboleth-ds/blank.gif /etc/shibboleth-ds/blank.gif
</IfModule>
</VirtualHost>
